<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUNAR ARCANA · Rider–Waite–Smith</title>

<script id="embedded-images" type="application/json">{}</script>

<style>
:root{
  --bg:#080611;
  --panel:#141020;
  --panel2:#0d0a16;
  --gold:#e2bf73;
  --gold2:#f3d797;
  --cream:#f5ecdb;
  --text:#f7f1e9;
  --muted:#a79caf;
  --line:rgba(226,191,115,.28);
  --line2:rgba(255,255,255,.07);
  --shadow:0 24px 70px rgba(0,0,0,.48);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(900px 600px at 8% -5%,rgba(112,75,166,.22),transparent 62%),
    radial-gradient(760px 540px at 95% 10%,rgba(226,191,115,.09),transparent 58%),
    linear-gradient(155deg,#06050b,#100b19 55%,#07050d);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.42;
  background-image:
    radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 1.35px),
    radial-gradient(circle at 75% 18%,#fff 0 1px,transparent 1.35px),
    radial-gradient(circle at 42% 75%,#fff 0 1px,transparent 1.35px),
    radial-gradient(circle at 90% 63%,#e5c47b 0 1px,transparent 1.4px);
  background-size:260px 260px,330px 330px,310px 310px,420px 420px;
}
.shell{width:min(1240px,94vw);margin:0 auto;padding:44px 0 68px}
.hero{text-align:center;padding:8px 0 28px}
.moon{font-size:50px;color:var(--gold2);filter:drop-shadow(0 0 18px rgba(226,191,115,.18));margin-bottom:5px}
.kicker{font-family:Georgia,serif;color:var(--gold2);font-size:11px;letter-spacing:.32em;text-transform:uppercase}
h1{
  margin:12px 0 10px;font-family:Georgia,"Times New Roman","Noto Serif SC",serif;
  font-size:clamp(39px,6vw,70px);font-weight:500;letter-spacing:.04em
}
.hero p{max-width:800px;margin:auto;color:var(--muted);font-size:13px;line-height:1.85}
.panel{
  background:linear-gradient(180deg,rgba(26,20,41,.92),rgba(10,8,18,.95));
  border:1px solid rgba(226,191,115,.17);border-radius:30px;padding:24px;
  box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.03)
}
.topbar{
  display:flex;justify-content:space-between;align-items:center;gap:13px;flex-wrap:wrap;
  padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.025)
}
.round{font-family:Georgia,serif;color:var(--gold2);letter-spacing:.06em}
.round small{display:block;margin-top:5px;color:#8e829b;font:11px/1.5 Inter,sans-serif;letter-spacing:0}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--text);
  min-height:42px;padding:10px 16px;border-radius:999px;cursor:pointer;transition:.2s;font-size:12px
}
.btn:hover{transform:translateY(-1px);border-color:rgba(226,191,115,.62)}
.btn.primary{
  color:#211608;border:0;font-weight:760;
  background:linear-gradient(135deg,#c39447,#f0d18c,#c99f55);
  box-shadow:0 8px 24px rgba(217,176,101,.17)
}
.controls{padding:28px 0 13px}
.inputs{display:flex;justify-content:center;gap:11px;flex-wrap:wrap}
.inputbox{position:relative}
.inputbox label{
  position:absolute;left:12px;top:-7px;background:#151021;padding:0 7px;
  color:#9989ae;font-size:9px;letter-spacing:.16em
}
input{
  width:145px;height:54px;border:1px solid var(--line);border-radius:14px;
  background:rgba(5,4,10,.62);color:#fff;text-align:center;font-family:Georgia,serif;
  font-size:19px;outline:none
}
input:focus{border-color:rgba(226,191,115,.72);box-shadow:0 0 0 4px rgba(226,191,115,.05)}
.tip{text-align:center;color:#83798d;font-size:11px;margin:11px 0 17px}
.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
.section-title{
  display:flex;align-items:center;justify-content:center;gap:13px;
  margin:27px 0 16px;color:#a99cb6;font:11px Georgia,serif;letter-spacing:.19em
}
.section-title:before,.section-title:after{
  content:"";height:1px;width:min(110px,15vw);
  background:linear-gradient(90deg,transparent,var(--line))
}
.section-title:after{background:linear-gradient(90deg,var(--line),transparent)}
.spread{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.slot-head{
  display:flex;justify-content:space-between;padding:0 4px 8px;
  font-size:10px;color:#897e94;letter-spacing:.14em;text-transform:uppercase
}
.slot-head .pos{color:var(--gold2)}
.flip{height:625px;perspective:1600px;cursor:pointer}
.flip-inner{
  position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform 1s cubic-bezier(.22,.72,.18,1)
}
.flip.revealed .flip-inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;border-radius:23px;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid rgba(226,191,115,.31);box-shadow:0 20px 48px rgba(0,0,0,.38)
}
.back{
  display:grid;place-items:center;
  background:
    radial-gradient(circle at 50% 50%,rgba(226,191,115,.12),transparent 24%),
    repeating-radial-gradient(circle at 50% 50%,rgba(226,191,115,.035) 0 1px,transparent 1px 14px),
    linear-gradient(145deg,#1d142b,#090712)
}
.back:before{content:"";position:absolute;inset:13px;border:1px solid rgba(226,191,115,.24);border-radius:16px}
.back:after{
  content:"";position:absolute;inset:23px;border:1px solid rgba(226,191,115,.10);border-radius:12px;
  background:
    linear-gradient(45deg,transparent 49.6%,rgba(226,191,115,.11) 50%,transparent 50.4%),
    linear-gradient(-45deg,transparent 49.6%,rgba(226,191,115,.11) 50%,transparent 50.4%),
    radial-gradient(circle,transparent 0 48px,rgba(226,191,115,.12) 49px 50px,transparent 51px)
}
.backmark{z-index:2;text-align:center;color:var(--gold2)}
.backmark .crescent{font-size:70px;font-family:Georgia,serif;text-shadow:0 0 25px rgba(226,191,115,.22)}
.backmark .word{margin-top:10px;font:10px Georgia,serif;letter-spacing:.28em;color:#b69b64}
.front{
  transform:rotateY(180deg);
  background:linear-gradient(180deg,#15101f,#090710);
  padding:13px;display:flex;align-items:center;justify-content:center
}
.image-shell{
  width:100%;height:100%;border-radius:15px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;background:#050408;
  border:1px solid rgba(226,191,115,.25);position:relative
}
.card-img{
  display:block;max-width:100%;max-height:100%;width:auto;height:auto;
  object-fit:contain;transition:transform .4s ease
}
.card-img.reversed{transform:rotate(180deg)}
.image-loading{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  color:#8c8099;font:12px/1.7 Georgia,serif;padding:30px;z-index:-1
}
.meta{
  margin-top:11px;min-height:127px;padding:14px 15px;border-radius:16px;
  border:1px solid var(--line2);background:rgba(255,255,255,.025)
}
.meta .cn{font:22px Georgia,"Noto Serif SC",serif;color:#fff0cf}
.meta .en{font-size:11px;color:#8e819c;margin-top:3px}
.meta .keys{font-size:12px;color:#c5bacf;line-height:1.65;margin-top:9px}
.badge{
  display:inline-block;margin-top:8px;border:1px solid rgba(226,191,115,.24);
  border-radius:999px;padding:4px 9px;color:#e4c476;font-size:10px
}
.result{
  margin-top:21px;padding:14px 17px;border:1px solid var(--line2);border-radius:16px;
  background:rgba(0,0,0,.16);text-align:center;color:#c8bdcf;font-size:12px;line-height:1.75
}
details{margin-top:19px}
summary{
  list-style:none;cursor:pointer;text-align:center;color:#9d90a9;font-size:11px;letter-spacing:.07em
}
summary::-webkit-details-marker{display:none}
summary:before{content:"✧";margin-right:8px;color:var(--gold)}
.deckgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:12px}
.deckitem{
  padding:8px;border:1px solid var(--line2);border-radius:9px;background:rgba(255,255,255,.02);
  color:#a99db7;font-size:10px;line-height:1.5
}
.deckitem b{color:#e7cb8d}
.source-note{
  margin-top:21px;text-align:center;color:#756b80;font-size:10px;line-height:1.7
}
.status-pill{
  display:inline-flex;align-items:center;gap:7px;margin-bottom:7px;padding:5px 10px;
  border:1px solid var(--line2);border-radius:999px;background:rgba(255,255,255,.02)
}
.status-dot{width:7px;height:7px;border-radius:50%;background:#d5a95b;box-shadow:0 0 11px rgba(213,169,91,.4)}
.status-pill.offline .status-dot{background:#82b68a;box-shadow:0 0 11px rgba(130,182,138,.42)}
.progress{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,22px);
  background:#17111f;border:1px solid var(--line);border-radius:999px;padding:10px 15px;
  color:#e6cc91;font-size:11px;opacity:0;pointer-events:none;transition:.25s;
  box-shadow:0 13px 35px rgba(0,0,0,.42);z-index:99
}
.progress.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:950px){.flip{height:540px}.spread{gap:12px}}
@media(max-width:720px){
  .shell{width:min(95vw,620px);padding-top:25px}
  .panel{padding:16px}.spread{grid-template-columns:1fr;gap:27px}
  .flip{height:650px}.deckgrid{grid-template-columns:repeat(3,1fr)}
}
@media(prefers-reduced-motion:reduce){.flip-inner{transition-duration:.01ms}}
</style>
</head>

<body>
<div class="shell">
  <header class="hero">
    <div class="moon">☾</div>
    <div class="kicker">Lunar Arcana · Rider–Waite–Smith</div>
    <h1>三张塔罗</h1>
    <p>使用 Rider–Waite–Smith 原版牌面。每次刷新或重新洗牌时，完整 78 张牌都会重新随机排列；
      你输入的三个数字只代表<strong>这一轮牌堆的位置</strong>。</p>
  </header>

  <main class="panel">
    <div class="topbar">
      <div class="round">
        本轮牌序 · <span id="shuffleId">——</span>
        <small>重新洗牌后，数字对应关系与正逆位都会变化。</small>
      </div>
      <div class="top-actions">
        <button class="btn" id="offlineBtn">⇩ 生成完全离线版</button>
        <button class="btn" id="reshuffleBtn">↻ 重新洗牌</button>
      </div>
    </div>

    <section class="controls">
      <div class="inputs">
        <div class="inputbox"><label>FIRST</label><input id="n1" type="number" min="1" max="78" placeholder="1–78"></div>
        <div class="inputbox"><label>SECOND</label><input id="n2" type="number" min="1" max="78" placeholder="1–78"></div>
        <div class="inputbox"><label>THIRD</label><input id="n3" type="number" min="1" max="78" placeholder="1–78"></div>
      </div>
      <div class="tip">抽牌前牌面不会显示。点击翻牌后，三张牌会依次揭示。</div>
      <div class="actions">
        <button class="btn primary" id="drawBtn">翻开这三张牌</button>
        <button class="btn" id="randomBtn">随机三个数字</button>
      </div>
    </section>

    <div class="section-title">THE THREE CARD SPREAD</div>
    <section id="spread" class="spread"></section>

    <div id="result" class="result">牌已洗好。请输入三个数字。</div>

    <details>
      <summary>查看本轮 1–78 完整对应表</summary>
      <div id="deckGrid" class="deckgrid"></div>
    </details>
  </main>

  <div class="source-note">
    <div id="sourceStatus" class="status-pill"><span class="status-dot"></span><span>原版牌面在线载入 · 可一键生成完全离线版</span></div><br>
    Rider–Waite–Smith · Pamela Colman Smith · 1909
  </div>
</div>

<div id="progress" class="progress"></div>

<script>
const EMBEDDED_IMAGES=JSON.parse(document.getElementById("embedded-images").textContent||"{}");

const PRIMARY_BASE="https://raw.githubusercontent.com/seven102161/elaine-tarot-cards/main/cards/";
const FALLBACK_BASE="https://petaloverflow.github.io/tarot-api/cards/";

const majors=[
["ar00","愚者","The Fool","开始、自由、冒险"],
["ar01","魔术师","The Magician","行动、创造、资源"],
["ar02","女祭司","The High Priestess","直觉、潜意识、静观"],
["ar03","皇后","The Empress","丰盛、滋养、创造力"],
["ar04","皇帝","The Emperor","秩序、责任、掌控"],
["ar05","教皇","The Hierophant","传统、学习、信念"],
["ar06","恋人","The Lovers","关系、选择、价值观"],
["ar07","战车","The Chariot","意志、推进、胜利"],
["ar08","力量","Strength","勇气、自控、内在力量"],
["ar09","隐者","The Hermit","独处、寻找、内省"],
["ar10","命运之轮","Wheel of Fortune","变化、周期、机会"],
["ar11","正义","Justice","公平、因果、判断"],
["ar12","倒吊人","The Hanged Man","暂停、换位、放下"],
["ar13","死神","Death","结束、转化、重生"],
["ar14","节制","Temperance","平衡、整合、耐心"],
["ar15","恶魔","The Devil","束缚、欲望、执念"],
["ar16","高塔","The Tower","突变、冲击、真相"],
["ar17","星星","The Star","希望、疗愈、指引"],
["ar18","月亮","The Moon","不安、想象、未知"],
["ar19","太阳","The Sun","喜悦、清晰、成功"],
["ar20","审判","Judgement","觉醒、召唤、复盘"],
["ar21","世界","The World","完成、圆满、整合"]
];

const ranks=[
["ac","王牌","Ace"],["02","二","Two"],["03","三","Three"],["04","四","Four"],
["05","五","Five"],["06","六","Six"],["07","七","Seven"],["08","八","Eight"],
["09","九","Nine"],["10","十","Ten"],["pa","侍从","Page"],["kn","骑士","Knight"],
["qu","皇后","Queen"],["ki","国王","King"]
];
const suits=[
["wa","权杖","Wands","行动、热情、事业"],
["cu","圣杯","Cups","感情、关系、直觉"],
["sw","宝剑","Swords","思考、冲突、决定"],
["pe","星币","Pentacles","金钱、现实、稳定"]
];
const nuance=[
"新机会、种子、开始","选择、平衡、互动","发展、合作、扩张","稳定、边界、守成",
"挑战、摩擦、考验","恢复、调整、推进","评估、耐心、策略","行动、速度、突破",
"积累、独立、成熟","结果、完成、责任","消息、学习、好奇","追求、冲劲、执行",
"成熟、照顾、内在掌控","领导、稳定、外在掌控"
];

const deck=majors.map((m,i)=>({id:i+1,code:m[0],cn:m[1],en:m[2],meaning:m[3]}));
let id=23;
for(const s of suits){
  ranks.forEach((r,i)=>deck.push({
    id:id++,code:s[0]+r[0],cn:s[1]+r[1],en:`${r[2]} of ${s[2]}`,meaning:`${s[3]}；${nuance[i]}`
  }));
}

let shuffled=[];

function randomInt(max){
  if(window.crypto?.getRandomValues){
    const a=new Uint32Array(1);crypto.getRandomValues(a);
    return Math.floor(a[0]/4294967296*max);
  }
  return Math.floor(Math.random()*max);
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=randomInt(i+1);[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function shuffleId(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";
  for(let i=0;i<6;i++)s+=chars[randomInt(chars.length)];
  return s;
}
function sourceFor(code){
  return EMBEDDED_IMAGES[code] || PRIMARY_BASE+code+".jpg";
}
function fallbackFor(code){
  return FALLBACK_BASE+code+".jpg";
}
function imgError(img){
  if(EMBEDDED_IMAGES[img.dataset.code]){
    img.style.display="none";
    img.nextElementSibling.textContent="内置牌面读取失败";
    return;
  }
  if(!img.dataset.usedFallback){
    img.dataset.usedFallback="1";
    img.src=img.dataset.fallback;
  }else{
    img.style.display="none";
    img.nextElementSibling.textContent="原版牌面暂时载入失败。请检查网络，或稍后重试。";
  }
}
function emptySlot(i){
  return `<article>
    <div class="slot-head"><span>CARD ${String(i+1).padStart(2,"0")}</span><span class="pos">POSITION —</span></div>
    <div class="flip">
      <div class="flip-inner">
        <div class="face back"><div class="backmark"><div class="crescent">☾</div><div class="word">LUNAR ARCANA</div></div></div>
        <div class="face front"><div class="image-shell"><div style="color:#776b83;font:12px Georgia,serif">等待翻牌</div></div></div>
      </div>
    </div>
    <div class="meta"><div class="cn">尚未揭示</div><div class="en">The card remains hidden.</div><div class="keys">输入三个数字后再翻牌。</div></div>
  </article>`;
}
function renderEmpty(){
  document.getElementById("spread").innerHTML=[0,1,2].map(emptySlot).join("");
}
function renderGrid(){
  document.getElementById("deckGrid").innerHTML=shuffled.map((c,i)=>
    `<div class="deckitem"><b>${i+1}</b> · ${c.cn}<br>${c.orientation}</div>`).join("");
}
function reshuffle(){
  shuffled=shuffle(deck).map(c=>({...c,orientation:randomInt(2)===0?"正位":"逆位"}));
  document.getElementById("shuffleId").textContent=shuffleId();
  renderEmpty();renderGrid();
  document.getElementById("result").textContent="牌已经重新洗好。数字对应关系与正逆位均已改变。";
}
function values(){
  const v=["n1","n2","n3"].map(x=>Number(document.getElementById(x).value));
  return v.some(n=>!Number.isInteger(n)||n<1||n>78)?null:v;
}
function slot(card,pos,i){
  const reversed=card.orientation==="逆位"?" reversed":"";
  return `<article>
    <div class="slot-head"><span>CARD ${String(i+1).padStart(2,"0")}</span><span class="pos">POSITION ${String(pos).padStart(2,"0")}</span></div>
    <div class="flip" data-index="${i}">
      <div class="flip-inner">
        <div class="face back"><div class="backmark"><div class="crescent">☾</div><div class="word">LUNAR ARCANA</div></div></div>
        <div class="face front">
          <div class="image-shell">
            <img class="card-img${reversed}"
              src="${sourceFor(card.code)}"
              data-code="${card.code}"
              data-fallback="${fallbackFor(card.code)}"
              alt="${card.cn} / ${card.en}"
              onerror="imgError(this)">
            <div class="image-loading">正在载入 Rider–Waite–Smith 原版牌面…</div>
          </div>
        </div>
      </div>
    </div>
    <div class="meta">
      <div class="cn">${card.cn}</div>
      <div class="en">${card.en}</div>
      <div class="keys">关键词：${card.orientation==="逆位"?"阻滞、内化、延迟；":""}${card.meaning}</div>
      <div class="badge">${card.orientation}</div>
    </div>
  </article>`;
}
function reveal(){
  const nums=values();
  if(!nums){showProgress("请输入三个 1–78 之间的整数",1500);return}
  const cards=nums.map(n=>shuffled[n-1]);
  document.getElementById("spread").innerHTML=cards.map((c,i)=>slot(c,nums[i],i)).join("");
  const flips=[...document.querySelectorAll(".flip")];
  flips.forEach((el,i)=>{
    el.addEventListener("click",()=>el.classList.toggle("revealed"));
    setTimeout(()=>el.classList.add("revealed"),320+i*430);
  });
  document.getElementById("result").innerHTML=
    nums.map((n,i)=>`${n} → <strong style="color:#e7cb8d">${cards[i].cn}</strong>（${cards[i].orientation}）`).join("　✦　");
}
function randomThree(){
  const a=[];
  while(a.length<3){const n=randomInt(78)+1;if(!a.includes(n))a.push(n)}
  ["n1","n2","n3"].forEach((x,i)=>document.getElementById(x).value=a[i]);
  reveal();
}

let progressTimer;
function showProgress(msg,hideAfter=0){
  const el=document.getElementById("progress");
  el.textContent=msg;el.classList.add("show");
  clearTimeout(progressTimer);
  if(hideAfter)progressTimer=setTimeout(()=>el.classList.remove("show"),hideAfter);
}
function hideProgress(){document.getElementById("progress").classList.remove("show")}

function blobToDataURL(blob){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob);
  });
}
async function fetchImageData(card){
  if(EMBEDDED_IMAGES[card.code])return EMBEDDED_IMAGES[card.code];
  const urls=[PRIMARY_BASE+card.code+".jpg",FALLBACK_BASE+card.code+".jpg"];
  let lastErr;
  for(const url of urls){
    try{
      const res=await fetch(url,{mode:"cors",cache:"force-cache"});
      if(!res.ok)throw new Error("HTTP "+res.status);
      return await blobToDataURL(await res.blob());
    }catch(e){lastErr=e}
  }
  throw lastErr||new Error("download failed");
}
async function exportOffline(){
  if(Object.keys(EMBEDDED_IMAGES).length===78){
    showProgress("当前文件已经是完全离线版",1700);
    return;
  }
  const button=document.getElementById("offlineBtn");
  button.disabled=true;
  const map={...EMBEDDED_IMAGES};
  try{
    let done=Object.keys(map).length;
    const queue=deck.filter(c=>!map[c.code]);
    let cursor=0;
    async function worker(){
      while(cursor<queue.length){
        const card=queue[cursor++];
        showProgress(`正在嵌入原版牌面 ${done+1}/78 · ${card.cn}`);
        map[card.code]=await fetchImageData(card);
        done++;
      }
    }
    await Promise.all(Array.from({length:5},worker));
    const dataScript=document.getElementById("embedded-images");
    const old=dataScript.textContent;
    dataScript.textContent=JSON.stringify(map);
    const html="<!doctype html>\n"+document.documentElement.outerHTML;
    dataScript.textContent=old;

    const blob=new Blob([html],{type:"text/html;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="lunar_arcana_RWS_OFFLINE.html";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
    showProgress("完成：真正离线版已生成",2400);
  }catch(e){
    console.error(e);
    showProgress("离线版生成失败：图片源暂时无法下载，请稍后重试",2600);
  }finally{
    button.disabled=false;
  }
}

document.getElementById("drawBtn").addEventListener("click",reveal);
document.getElementById("randomBtn").addEventListener("click",randomThree);
document.getElementById("reshuffleBtn").addEventListener("click",reshuffle);
document.getElementById("offlineBtn").addEventListener("click",exportOffline);
["n1","n2","n3"].forEach(id=>document.getElementById(id).addEventListener("keydown",e=>{if(e.key==="Enter")reveal()}));

if(Object.keys(EMBEDDED_IMAGES).length===78){
  const p=document.getElementById("sourceStatus");
  p.classList.add("offline");
  p.innerHTML='<span class="status-dot"></span><span>78 张 Rider–Waite–Smith 原版牌面已内置 · 完全离线</span>';
  document.getElementById("offlineBtn").textContent="✓ 已是完全离线版";
}
reshuffle();
