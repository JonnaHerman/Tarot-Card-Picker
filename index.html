const EMBEDDED=JSON.parse(document.getElementById("embedded-images").textContent||"{}"),PRIMARY="https://raw.githubusercontent.com/seven102161/elaine-tarot-cards/main/cards/",FALLBACK="https://petaloverflow.github.io/tarot-api/cards/";
const imgSrc=c=>EMBEDDED[c]||PRIMARY+c+".jpg",imgFallback=c=>FALLBACK+c+".jpg";
function imageError(img){if(!img.dataset.fallbackUsed){img.dataset.fallbackUsed="1";img.src=img.dataset.fallback}else img.style.opacity=".16"}

let spreadFilter="all",currentSpread=null,shuffled=[],shuffleId="",deferredInstall=null;
const viewport=document.getElementById("viewport"),bottomNav=document.getElementById("bottomNav"),localText=o=>o?.[locale]||o?.en||"";
function showScreen(n,nav=true){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(n+"Screen").classList.add("active");bottomNav.style.display=nav?"grid":"none";document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.screen===n));viewport.scrollTop=0}
function randomInt(max){const a=new Uint32Array(1);crypto.getRandomValues(a);return Math.floor(a[0]/4294967296*max)}
function shuffleDeck(){shuffled=[...deck];for(let i=shuffled.length-1;i>0;i--){const j=randomInt(i+1);[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}shuffled=shuffled.map(c=>({...c,orientation:randomInt(2)?"up":"rev"}));const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";shuffleId="";for(let i=0;i<6;i++)shuffleId+=chars[randomInt(chars.length)]}
function getHistory(){try{return JSON.parse(localStorage.getItem("la-history")||"[]")}catch{return[]}}

function renderNav(){document.querySelectorAll("[data-nav]").forEach(e=>e.textContent=T(e.dataset.nav))}
function renderHome(){const hist=getHistory().slice(0,3),e=document.getElementById("homeScreen");e.innerHTML=`<div class="hero"><div class="moon-orbit">☾</div><div class="hero-kicker">LUNAR ARCANA</div><h1>${T("homeQ")}</h1><p>${T("homeSub")}</p></div><div class="daily-card" onclick="startReading('daily')"><div class="daily-top"><span class="daily-badge">DAILY READING</span><span class="daily-symbol">☀</span></div><h3>${T("daily")}</h3><p>${T("dailyDesc")}</p><span class="daily-action">${T("start")} →</span></div><div class="section-row"><div class="section-title">${T("explore")}</div></div><div class="category-grid">${cat("love","♡")}${cat("career","♜")}${cat("self","☾")}${cat("study","✎")}</div><div class="section-row"><div class="section-title">${T("recent")}</div><button class="section-link" onclick="showSpreads()">${T("viewAll")}</button></div><div class="recent-list">${hist.length?hist.map(r=>`<div class="recent-item" onclick="startReading('${r.spreadId}')"><div class="recent-top"><div class="recent-title">${localText(SPREADS.find(s=>s.id===r.spreadId).name)}</div><div class="recent-date">${new Date(r.time).toLocaleDateString(locale)}</div></div><div class="recent-cards">${r.cards.join(" · ")}</div></div>`).join(""):`<div class="recent-empty">${T("noRecent")}</div>`}</div>`}
function cat(c,i){return `<div class="category-card" onclick="openCategory('${c}')"><div class="cat-icon">${i}</div><div class="cat-name">${T(c)}</div><div class="cat-sub">${T("spreads")} →</div></div>`}
function openCategory(c){spreadFilter=c;renderSpreads();showScreen("spreads")}function showSpreads(){spreadFilter="all";renderSpreads();showScreen("spreads")}
function renderSpreads(){const e=document.getElementById("spreadsScreen"),cats=["all","popular","love","career","self"],list=SPREADS.filter(s=>spreadFilter==="all"||s.cat===spreadFilter);e.innerHTML=`<div class="page-head"><h2 class="page-title">${T("spreadsTitle")}</h2><div class="page-sub">${T("spreadsSub")}</div></div><div class="chips">${cats.map(c=>`<button class="chip ${spreadFilter===c?"active":""}" onclick="spreadFilter='${c}';renderSpreads()">${T(c)}</button>`).join("")}</div><div class="spread-list">${list.map(s=>`<div class="spread-card" onclick="startReading('${s.id}')"><div class="spread-mini">${s.icon}</div><div><h3>${localText(s.name)}</h3><p>${localText(s.desc)}</p><div class="spread-meta">${s.count} ${T("cardsCount")} · ${s.min} ${T("minutes")}</div></div><div class="chev">›</div></div>`).join("")}</div>`}
function renderCards(q=""){const e=document.getElementById("cardsScreen"),term=q.toLowerCase().trim(),list=deck.filter(c=>!term||cardName(c).toLowerCase().includes(term)||cardEnglish(c).toLowerCase().includes(term));e.innerHTML=`<div class="page-head"><h2 class="page-title">${T("cardsTitle")}</h2><div class="page-sub">${T("cardsSub")}</div></div><input class="search" id="cardSearch" value="${q.replace(/"/g,"&quot;")}" placeholder="${T("search")}"><div class="card-library">${list.map(c=>`<div class="library-card" onclick="openCard(${c.id})"><div class="library-thumb"><img src="${imgSrc(c.code)}" data-fallback="${imgFallback(c.code)}" onerror="imageError(this)"></div><div class="library-name">${cardName(c)}</div><div class="library-sub">${c.type==="major"?T("major"):T("minor")}</div></div>`).join("")||`<div class="recent-empty" style="grid-column:1/-1">${T("noResults")}</div>`}</div>`;document.getElementById("cardSearch").oninput=x=>renderCards(x.target.value)}
function openCard(id){const c=deck.find(x=>x.id===id),e=document.getElementById("cardDetailScreen");e.innerHTML=`<div class="reading-header"><button class="back-btn" id="cardBack">‹</button><div><div class="reading-title">${cardName(c)}</div><div class="reading-sub">${cardEnglish(c)}</div></div></div><div class="card-detail"><img src="${imgSrc(c.code)}" data-fallback="${imgFallback(c.code)}" onerror="imageError(this)"><h2>${cardName(c)}</h2><div class="minor">${cardEnglish(c)}</div><p><b>${T("cardMeaning")}：</b>${cardKeywords(c)}</p></div>`;showScreen("cardDetail",false);document.getElementById("cardBack").onclick=()=>{renderCards();showScreen("cards")}}
function renderSettings(){const e=document.getElementById("settingsScreen");e.innerHTML=`<div class="page-head"><h2 class="page-title">${T("settingsTitle")}</h2><div class="page-sub">${T("settingsSub")}</div></div><div class="settings-group"><div class="setting"><div class="setting-label">${T("language")}</div><div class="setting-desc">${T("languageDesc")}</div><select class="select" id="langSel">${LOCALES.map(l=>`<option value="${l}" ${l===locale?"selected":""}>${LANG_LABELS[l]}</option>`).join("")}</select></div><div class="setting"><div class="setting-label">${T("install")}</div><div class="setting-desc">${T("installDesc")}</div><button class="btn primary" id="installBtn">${T("installBtn")}</button></div><div class="setting"><div class="setting-label">${T("offline")}</div><div class="setting-desc">${T("offlineDesc")}</div><button class="btn" id="offlineBtn">${T("offlineBtn")}</button></div><div class="setting"><div class="setting-label">${T("clearHistory")}</div><div class="setting-desc">${T("clearHistoryDesc")}</div><button class="btn danger" id="clearBtn">${T("clearBtn")}</button></div><div class="setting"><div class="setting-label">${T("about")}</div><div class="setting-desc" style="margin:0">${T("aboutText")}</div></div></div>`;document.getElementById("langSel").onchange=x=>setLocale(x.target.value);document.getElementById("installBtn").onclick=installApp;document.getElementById("offlineBtn").onclick=exportOffline;document.getElementById("clearBtn").onclick=()=>{localStorage.removeItem("la-history");renderHome();toast(T("cleared"))}}
function setLocale(l){locale=l;localStorage.setItem("la-locale",l);document.documentElement.lang=l;renderAll();showScreen("settings")}
function renderAll(){renderNav();renderHome();renderSpreads();renderCards();renderSettings()}

function startReading(id){currentSpread=SPREADS.find(s=>s.id===id);shuffleDeck();renderReading();showScreen("reading",false)}
function renderReading(){const s=currentSpread,e=document.getElementById("readingScreen");e.innerHTML=`<div class="reading-header"><button class="back-btn" id="readBack">‹</button><div><div class="reading-title">${localText(s.name)}</div><div class="reading-sub">${s.count} ${T("cardsCount")} · ${s.min} ${T("minutes")}</div></div></div><div class="spread-note">${localText(s.desc)}<br><span style="color:#625968">${T("note")}</span></div><div class="section-row"><div class="section-title">${T("spreadPositions")}</div></div><div class="position-preview">${s.positions.map((x,i)=>`<div class="position-row"><div class="pos-num">${i+1}</div><div><div class="pos-title">${localText(x.title)}</div><div class="pos-hint">${localText(x.hint)}</div></div></div>`).join("")}</div><textarea class="question" placeholder="${T("questionPh")}"></textarea><div class="shuffle-bar"><div class="shuffle-id">${T("shuffle")} · <b>${shuffleId}</b></div><button class="small-btn" id="reshuffleBtn">${T("reshuffle")}</button></div><div class="page-sub" style="margin-bottom:8px">${T("numbersHint")}</div><div class="number-grid count-${s.count}">${Array.from({length:s.count},(_,i)=>`<input class="num-input" inputmode="numeric" type="number" min="1" max="78" placeholder="${i+1}">`).join("")}</div><div class="read-actions"><button class="btn" id="randomBtn">${T("random")}</button><button class="btn primary" id="revealBtn">${T("reveal")}</button></div><div id="results"></div>`;document.getElementById("readBack").onclick=()=>{renderSpreads();showScreen("spreads")};document.getElementById("reshuffleBtn").onclick=()=>{shuffleDeck();renderReading();toast(T("reshuffled"))};document.getElementById("randomBtn").onclick=fillRandom;document.getElementById("revealBtn").onclick=revealReading}
function fillRandom(){const nums=[];while(nums.length<currentSpread.count){const n=randomInt(78)+1;if(!nums.includes(n))nums.push(n)}document.querySelectorAll(".num-input").forEach((x,i)=>x.value=nums[i])}
function readNums(){const nums=[...document.querySelectorAll(".num-input")].map(x=>Number(x.value));if(nums.length!==currentSpread.count||nums.some(n=>!Number.isInteger(n)||n<1||n>78)||new Set(nums).size!==nums.length)return null;return nums}
function revealReading(){const nums=readNums();if(!nums){toast(T("invalidNums"));return}const cs=nums.map(n=>shuffled[n-1]),e=document.getElementById("results");e.innerHTML=`<div class="reveal-list">${cs.map((c,i)=>readingCard(c,currentSpread.positions[i],i)).join("")}</div><div class="summary-card"><h3>${T("summary")}</h3><p>${T("summaryText")}</p></div><div class="disclaimer">${T("note")}</div>`;document.querySelectorAll(".tarot-frame").forEach((f,i)=>setTimeout(()=>f.classList.add("revealed"),220+i*300));const hist=getHistory();hist.unshift({time:Date.now(),spreadId:currentSpread.id,cards:cs.map(c=>cardName(c))});localStorage.setItem("la-history",JSON.stringify(hist.slice(0,20)));renderHome();toast(T("saved"))}
function readingCard(c,x,i){const rev=c.orientation==="rev";return `<div class="reading-card"><div class="position-label">${i+1}. ${localText(x.title)}</div><div class="tarot-frame"><div class="flip-inner"><div class="face card-back"><div class="card-back-mark">☾</div></div><div class="face card-front"><img class="${rev?"reversed":""}" src="${imgSrc(c.code)}" data-fallback="${imgFallback(c.code)}" onerror="imageError(this)"></div></div></div><div class="card-info"><h3>${cardName(c)}</h3><div class="card-alt">${cardEnglish(c)}</div><div class="orientation">${rev?T("reversed"):T("upright")}</div><div class="keywords"><b>${T("keywords")}：</b>${cardKeywords(c)}</div><div class="position-reading"><b>${T("positionReading")}：</b>${interpret(c,x)}</div></div></div>`}
function interpret(c,x){const title=localText(x.title),kw=cardKeywords(c);if(locale==="zh-CN")return `${title}中出现「${cardName(c)}」，可以重点观察${kw}。${c.orientation==="rev"?T("orientationRev"):"看看这股能量如何影响这个位置。"}`;if(locale==="zh-TW")return `${title}中出現「${cardName(c)}」，可以重點觀察${kw}。`;return `In ${title}, ${cardName(c)} highlights ${kw}. ${c.orientation==="rev"?T("orientationRev"):"Notice how this energy expresses itself through this position."}`}

window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e});async function installApp(){if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;return}toast(/iphone|ipad|ipod/i.test(navigator.userAgent)?T("installIOS"):T("installUnavailable"))}
function blobToDataURL(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)})}
async function exportOffline(){toast(T("offlineStart")+"…");const map={...EMBEDDED};try{const q=deck.filter(c=>!map[c.code]);let cursor=0;async function worker(){while(cursor<q.length){const c=q[cursor++];for(const u of [PRIMARY+c.code+".jpg",FALLBACK+c.code+".jpg"]){try{const r=await fetch(u,{mode:"cors"});if(!r.ok)throw 0;map[c.code]=await blobToDataURL(await r.blob());break}catch(e){}}if(!map[c.code])throw 0}}await Promise.all(Array.from({length:5},worker));const n=document.getElementById("embedded-images"),old=n.textContent;n.textContent=JSON.stringify(map);const data="<!doctype html>\n"+document.documentElement.outerHTML;n.textContent=old;const b=new Blob([data],{type:"text/html;charset=utf-8"}),url=URL.createObjectURL(b),a=document.createElement("a");a.href=url;a.download="lunar_arcana_v0.6_OFFLINE.html";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500);toast(T("offlineDone"))}catch(e){toast(T("offlineFail"))}}
let toastTimer;function toast(msg){let e=document.getElementById("toast");if(!e){e=document.createElement("div");e.id="toast";e.style.cssText="position:absolute;left:50%;bottom:82px;transform:translateX(-50%);z-index:100;background:#17111f;border:1px solid rgba(223,189,114,.25);border-radius:999px;padding:9px 13px;color:#e4c783;font-size:10px;box-shadow:0 12px 30px rgba(0,0,0,.4);max-width:90%;text-align:center;transition:.2s";document.getElementById("app").appendChild(e)}e.textContent=msg;e.style.opacity="1";clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.style.opacity="0",1800)}

document.querySelectorAll(".nav-btn").forEach(b=>b.onclick=()=>{const s=b.dataset.screen;if(s==="home")renderHome();if(s==="spreads")renderSpreads();if(s==="cards")renderCards();if(s==="settings")renderSettings();showScreen(s)});
document.getElementById("quickLang").onclick=()=>{renderSettings();showScreen("settings")};
function boot(){document.documentElement.lang=locale;renderAll();showScreen("home");if("serviceWorker" in navigator&&location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
boot();
